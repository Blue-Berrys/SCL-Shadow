# SCL-Shadow configuration for the SBU benchmark.
seed: 42

model:
  name: reference_unet   # swap for the official SDDNet via SDDNetAdapter

data:
  train_root: data/SBU/train
  val_root: data/SBU/test
  image_dir: images
  mask_dir: masks
  size: [416, 416]
  num_workers: 4

train:
  epochs: 50
  batch_size: 4
  lr: 0.0005
  poly_power: 0.7
  ckpt_path: checkpoints/scl_sbu_best.pth

# Iterative Confidence Aggregation (temporal reliability)
ica:
  alpha: 0.9         # EMA smoothing coefficient
  tau_high: 0.80     # upper confidence threshold
  tau_low: 0.20      # lower confidence threshold
  lambda_ica: 0.50   # down-weight factor for uncertain pixels

# Spatial Consistency Verification (spatial reliability)
scv:
  epsilon: 1         # boundary-count tolerance
  lambda_scv: 0.60   # down-weight factor for inconsistent blocks

# Boundary Refined Loss Function (training schedule)
brlf:
  warmup_epochs: 5
  period: 1          # per-epoch alternation
